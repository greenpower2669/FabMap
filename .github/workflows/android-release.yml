name: FabMap APK direct Release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fabmap-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runner already provides Android SDK command-line tools; do not invoke
      # setup-android@v3: it tries to install obsolete package 'tools' and aborts.
      - name: Repérer le SDK préinstallé et compléter si nécessaire
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK_ROOT/platforms/android-35/android.jar" || ! -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ]]; then
            yes | "$sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$sdkmanager" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Découper les icônes sources en sprites légers
        run: |
          javac tools/ExtractIconBoards.java
          java -cp tools ExtractIconBoards
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug -PbuildNumber="$GITHUB_RUN_NUMBER"
      - name: Publier APK directement en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.5.2-b$GITHUB_RUN_NUMBER"
          name="FabMap-v0.5.2-b$GITHUB_RUN_NUMBER-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          gh release create "$tag" "$name" \
            --target "$GITHUB_SHA" \
            --title "FabMap v0.5.2 build $GITHUB_RUN_NUMBER (test)" \
            --notes "APK de test avec signature debug temporaire : avant désinstallation sauvegarder les données." \
            --prerelease
          echo "APK DIRECT : https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
# Aucun upload-artifact : évite le stockage d'artefacts Actions, PAS les minutes CI.
