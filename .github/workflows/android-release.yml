name: FabMap APK direct Release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fabmap-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runner already provides Android SDK command-line tools; do not invoke
      # setup-android@v3: it tries to install obsolete package 'tools' and aborts.
      - name: Installer les composants SDK nécessaires
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug -PbuildNumber="$GITHUB_RUN_NUMBER"
      - name: Publier APK directement en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-b$GITHUB_RUN_NUMBER"
          name="FabMap-v0.1.0-b$GITHUB_RUN_NUMBER-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          gh release create "$tag" "$name" \
            --target "$GITHUB_SHA" \
            --title "FabMap v0.1.0 build $GITHUB_RUN_NUMBER (test)" \
            --notes "APK de test avec signature debug temporaire : avant désinstallation sauvegarder les données." \
            --prerelease
          echo "APK DIRECT : https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
# Aucun upload-artifact : évite le stockage d'artefacts Actions, PAS les minutes CI.
